[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
# Keep the default quality gate focused on syntax, undefined names, invalid noqa, and core Pyflakes errors.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
